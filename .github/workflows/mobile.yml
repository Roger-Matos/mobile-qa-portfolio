name: Mobile QA

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Static checks and API contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:api
      - name: Upload API provisioning logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-provisioning
          path: artifacts/api/*.log
          if-no-files-found: ignore
          retention-days: 14

  android:
    name: Android API 35
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TEST_SCRIPT: ${{ github.event_name == 'pull_request' && 'test:smoke' || 'test' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run setup
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run mobile tests on the emulator
        id: mobile
        uses: ReactiveCircus/android-emulator-runner@c9c93e6ba9c4194322e114c40970d5983d9a07cc # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: npm run "$TEST_SCRIPT"
      - name: Summarize emulator bootstrap failures
        if: failure()
        run: |
          if ! find artifacts -name provisioning.log -print -quit 2>/dev/null | grep -q .; then
            printf '### Android failed during dependency or emulator setup\n\n- Commit: `%s`\n- APK: v2.10.1 · Server: v3.1.1\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Generate Allure
        if: ${{ !cancelled() && (steps.mobile.outcome == 'success' || steps.mobile.outcome == 'failure') }}
        run: |
          if [[ -d allure-results ]]; then
            printf 'Git.Commit=%s\nGotify.Android=v2.10.1\nGotify.Server=v3.1.1\nAndroid.API=35\n' "$GITHUB_SHA" > allure-results/environment.properties
            npm run report
          elif [[ '${{ steps.mobile.outcome }}' == success ]]; then
            echo 'Mobile run succeeded without producing Allure results' >&2
            exit 1
          fi
      - name: Upload Android evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-evidence
          path: |
            artifacts/*/*.log
            allure-results/
            allure-report/
          if-no-files-found: ignore
          retention-days: 14
      - name: Prepare verified regression report for Pages
        if: success() && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: allure-report

  quality-gate:
    name: Mobile Quality Gate
    if: ${{ always() }}
    needs: [validate, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    env:
      VALIDATION: ${{ needs.validate.result }}
      MOBILE: ${{ needs.android.result }}
    steps:
      - run: test "$VALIDATION" = success && test "$MOBILE" = success

  publish:
    name: Publish Allure to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: quality-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
